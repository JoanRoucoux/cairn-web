<ui-dialog
  data-testid="holding-cash-dialog"
  width="480px"
  [busy]="form().submitting()"
  [closeLabel]="'dialog.close' | transloco"
  [heading]="(savings() ? 'holdings.balance.title' : 'holdings.cash.title') | transloco: { name: accountName() }"
  [open]="open()"
  (closed)="onClosed()"
  (dismissed)="dismiss()"
>
  <ui-field
    [hint]="!savings() && isZero() ? ('holdings.cash.zeroHint' | transloco) : ''"
    [label]="'holdings.cash.amount' | transloco"
  >
    <input
      appDecimalInput
      autocomplete="off"
      data-testid="holding-cash-amount"
      inputmode="decimal"
      size="lg"
      type="text"
      uiInput
      [formField]="form.amount"
    />
  </ui-field>

  @if (error()) {
    <ui-alert data-testid="holding-cash-error">
      {{ 'holdings.cash.error' | transloco }}
    </ui-alert>
  }

  <button
    class="max-lg:hidden"
    data-testid="holding-cash-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="form().submitting()"
    (click)="dismiss()"
  >
    {{ 'holdings.cash.cancel' | transloco }}
  </button>
  <button
    data-testid="holding-cash-submit"
    dialogActions
    type="button"
    ui-button
    [disabled]="form().submitting()"
    [loading]="form().submitting()"
    (click)="confirm()"
  >
    {{ 'holdings.cash.submit' | transloco }}
  </button>
</ui-dialog>
