<tr group uiTr>
  <td
    size="lg"
    ui-group-cell
    [attr.colspan]="compact() ? 3 : 7"
    [meta]="
      ('enums.accountType.' + group().accountType | transloco) +
      ' · ' +
      (group().institution ? group().institution + ' · ' : '') +
      (groupCount(group()).key | transloco: { count: groupCount(group()).count })
    "
    [name]="group().accountName"
  >
    <ui-amount currency="EUR" [value]="group().valueEur" />
  </td>
</tr>
@for (holding of group().holdings; track holding.id) {
  <tr
    app-holding-account-group-row
    interactive
    uiTr
    [compact]="compact()"
    [holding]="holding"
    [open]="holding.id === selectedHoldingId()"
    [selected]="holding.id === selectedHoldingId()"
  ></tr>
}
@if (group().showCash) {
  <tr data-testid="cash-row" interactive uiTr>
    <td primary uiTd>
      <button
        data-testid="edit-cash"
        type="button"
        uiRowLink
        [attr.aria-label]="'holdings.cash.editRow' | transloco: { name: group().accountName }"
        (click)="editCash.emit(group().accountId)"
      >
        {{ 'holdings.cash.line' | transloco }}
      </button>
      <span uiCellSub>{{ 'holdings.cash.entered' | transloco }}</span>
    </td>
    @if (!compact()) {
      <td numeric secondary uiTd></td>
      <td numeric secondary uiTd></td>
      <td numeric secondary uiTd></td>
    }
    <td class="font-medium" numeric uiTd>
      <ui-amount currency="EUR" [value]="group().cashEur" />
    </td>
    @if (!compact()) {
      <td numeric uiTd></td>
    }
    <td numeric uiTd></td>
  </tr>
}
