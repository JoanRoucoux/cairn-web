<div class="flex flex-col gap-4 md:hidden" data-testid="holdings-loading-cards">
  @for (card of cards; track card) {
    <div class="rounded-container flex flex-col gap-5 bg-(--card) p-4 shadow-[inset_0_0_0_1px_var(--border)]">
      <div class="flex justify-between">
        <ui-skeleton [height]="18" [style.width.px]="120" />
        <ui-skeleton [height]="18" [style.width.px]="100" />
      </div>
      @for (row of cardRows; track row) {
        <div class="flex items-center justify-between">
          <div class="flex flex-col gap-1.5">
            <ui-skeleton [height]="16" [style.width.px]="170" />
            <ui-skeleton [height]="12" [style.width.px]="90" />
          </div>
          <div class="flex flex-col items-end gap-1.5">
            <ui-skeleton [height]="16" [style.width.px]="96" />
            <ui-skeleton [height]="12" [style.width.px]="52" />
          </div>
        </div>
      }
    </div>
  }
</div>

<div class="flex flex-col gap-5.5 px-2 py-4 max-md:hidden" data-testid="holdings-loading-rows">
  @for (width of nameWidths; track $index) {
    <div class="flex items-center justify-between gap-6">
      <div class="flex flex-col gap-1.5">
        <ui-skeleton [height]="16" [style.width.px]="width" />
        <ui-skeleton [height]="12" [style.width.px]="120" />
      </div>
      <ui-skeleton [height]="16" [style.width.px]="420" />
    </div>
  }
</div>
