<ui-dialog
  data-testid="holding-delete-dialog"
  layout="confirm"
  width="488px"
  [heading]="'holdings.delete.title' | transloco"
  [open]="open()"
  (dismissed)="dismiss()"
>
  <p class="text-body text-(--muted-foreground)">{{ description() }}</p>

  @if (error()) {
    <p class="text-label text-(--negative)" data-testid="holding-delete-error" role="alert">
      {{ 'holdings.delete.error' | transloco }}
    </p>
  }

  <button
    data-testid="holding-delete-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="deleting()"
    (click)="dismiss()"
  >
    {{ 'holdings.delete.cancel' | transloco }}
  </button>
  <button
    data-testid="holding-delete-confirm"
    dialogActions
    type="button"
    ui-button
    variant="destructive"
    [disabled]="deleting()"
    (click)="confirm()"
  >
    {{ 'holdings.delete.submit' | transloco }}
  </button>
</ui-dialog>
