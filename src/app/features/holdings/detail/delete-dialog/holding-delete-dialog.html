<ui-dialog
  data-testid="holding-delete-dialog"
  variant="confirm"
  [busy]="deleting()"
  [heading]="'holdings.delete.title' | transloco"
  [open]="open()"
  (closed)="onClosed()"
  (dismissed)="dismiss()"
>
  <p class="text-body text-(--muted-foreground)">{{ description() }}</p>

  @if (error()) {
    <ui-alert data-testid="holding-delete-error">
      {{ 'holdings.delete.error' | transloco }}
    </ui-alert>
  }

  <button
    data-testid="holding-delete-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="deleting()"
    (click)="dismiss()"
  >
    {{ 'holdings.delete.cancel' | transloco }}
  </button>
  <button
    data-testid="holding-delete-confirm"
    dialogActions
    type="button"
    ui-button
    variant="destructive"
    [disabled]="deleting()"
    [loading]="deleting()"
    (click)="confirm()"
  >
    {{ 'holdings.delete.submit' | transloco }}
  </button>
</ui-dialog>
