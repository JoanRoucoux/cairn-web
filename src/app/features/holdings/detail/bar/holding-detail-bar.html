<ui-action-bar>
  <button data-testid="holding-sell-bar" size="tall" type="button" ui-button variant="outline" (click)="sell.emit()">
    {{ 'holdings.sell.open' | transloco }}
  </button>
  <button data-testid="holding-buy-bar" size="tall" type="button" ui-button (click)="buy.emit()">
    {{ 'holdings.buy.open' | transloco }}
  </button>
</ui-action-bar>
