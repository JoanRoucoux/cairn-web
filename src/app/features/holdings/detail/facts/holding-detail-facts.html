<ui-card padding="rows" surface="max-lg">
  <dl uiFacts [ruled]="desktop()">
    <div size="auto" ui-fact [label]="'holdings.columns.quantity' | transloco" [uiHighlight]="flash()">
      <ui-amount [fractionDigits]="decimalPlaces(holding().quantity)" [value]="holding().quantity" />
    </div>
    @if (holding().averageCost === null || holding().averageCost === undefined) {
      <div
        size="auto"
        ui-fact
        [label]="'holdings.averageCost' | transloco"
        [sub]="'holdings.detail.firstBuyFixes' | transloco"
        [uiHighlight]="flash()"
      >
        {{ 'holdings.detail.unknownCost' | transloco }}
      </div>
    } @else {
      <div size="auto" ui-fact [label]="'holdings.averageCost' | transloco" [uiHighlight]="flash()">
        <ui-amount currency="EUR" [value]="holding().averageCost" />
      </div>
    }
    <div
      size="auto"
      ui-fact
      [label]="'holdings.columns.price' | transloco"
      [sub]="
        holding().priceAsOf
          ? (priceSubKey() | transloco: { date: holding().priceAsOf | shortDate, time: quoteTime() })
          : ('holdings.noQuote' | transloco)
      "
      [subTone]="holding().stale ? 'stale' : 'subtle'"
    >
      <ui-amount [currency]="holding().priceCurrency ?? 'EUR'" [value]="holding().price" />
    </div>
    <div
      size="auto"
      ui-fact
      [label]="'holdings.detail.priceSource' | transloco"
      [sub]="holding().priceSource === 'MANUAL' ? ('holdings.detail.noAutomaticQuote' | transloco) : undefined"
    >
      {{ priceSourceLabel() }}
    </div>
    <div
      size="auto"
      ui-fact
      [label]="(crypto() ? 'holdings.detail.symbol' : 'holdings.detail.isin') | transloco"
      [sub]="'enums.assetClass.' + holding().assetClass | transloco"
    >
      {{ identifier() || '—' }}
    </div>
  </dl>
</ui-card>
