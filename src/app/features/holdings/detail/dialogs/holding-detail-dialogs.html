@if (pricingInstrument(); as pricing) {
  <app-manual-quote-dialog
    [holdingId]="holding().id"
    [instrumentId]="pricing.id"
    [instrumentName]="pricing.name"
    (dismissed)="quoteDismissed.emit()"
    (saved)="quoteSaved.emit()"
  />
}

@if (buyOpen()) {
  <app-holding-buy-dialog [holding]="buyHolding()" (bought)="bought.emit($event)" (dismissed)="buyDismissed.emit()" />
}

@if (sellOpen()) {
  <app-holding-sell-dialog [holding]="sellHolding()" (dismissed)="sellDismissed.emit()" (sold)="sold.emit($event)" />
}

@if (editOpen()) {
  <app-holding-edit-dialog
    [holding]="editHolding()"
    (dismissed)="editDismissed.emit()"
    (savedForm)="edited.emit($event)"
  />
}

@if (deleteOpen()) {
  <app-holding-delete-dialog
    [holding]="deleteHolding()"
    (deleted)="deleted.emit($event)"
    (dismissed)="deleteDismissed.emit()"
  />
}

@if (listingOpen()) {
  <app-holding-add-dialog
    [initialQuery]="listingQuery()"
    [replaceHoldingId]="listingHolding().id"
    (dismissed)="listingDismissed.emit()"
    (saved)="listingChanged.emit()"
  />
}
