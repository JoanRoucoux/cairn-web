@switch (shown()) {
  @case ('error') {
    <ui-alert [fadeIn]="false">{{ 'holdings.error' | transloco }}</ui-alert>
  }
  @case ('loading') {
    <p class="sr-only" role="status">{{ 'holdings.loading' | transloco }}</p>
    <ui-skeleton class="max-w-56" [height]="30" [lines]="2" />
    <ui-skeleton class="mt-6" [height]="168" />
  }
  @case ('empty') {
    <ui-alert [fadeIn]="false">{{ 'holdings.notFound' | transloco }}</ui-alert>
  }
}
