<div class="rounded-control flex items-start justify-between gap-3 border border-(--border) bg-(--background) p-3">
  <div class="flex min-w-0 flex-col gap-0.5">
    <span class="flex flex-wrap items-center gap-2">
      <span class="text-body font-medium">{{ name() }}</span>
      @if (isNew()) {
        <ui-badge>{{ 'holdings.add.newBadge' | transloco }}</ui-badge>
      }
    </span>
    <span class="text-caption text-(--subtle-foreground)">{{ sub() }}</span>
    @if (isNew()) {
      <span class="text-label text-(--muted-foreground)">{{ 'holdings.add.newNote' | transloco }}</span>
    }
  </div>
  <button data-testid="holding-add-change" type="button" ui-button variant="ghost" (click)="changed.emit()">
    {{ 'holdings.add.change' | transloco }}
  </button>
</div>

@if (manual()) {
  <ui-field class="mt-2" [label]="'holdings.add.assetClass' | transloco">
    <select
      data-testid="holding-add-asset-class"
      uiSelect
      [value]="assetClass() ?? ''"
      (change)="assetClassInput.emit($event)"
    >
      <option disabled value="">{{ 'holdings.add.chooseAssetClass' | transloco }}</option>
      @for (candidateClass of assetClasses(); track candidateClass) {
        <option [value]="candidateClass">{{ 'enums.assetClass.' + candidateClass | transloco }}</option>
      }
    </select>
  </ui-field>
}

<div class="mt-2 grid grid-cols-2 gap-2">
  <ui-field [label]="'holdings.add.quantity' | transloco">
    <input
      autocomplete="off"
      data-testid="holding-add-quantity"
      inputmode="decimal"
      type="text"
      uiInput
      [value]="quantityText()"
      (input)="quantityInput.emit($event)"
    />
  </ui-field>
  <ui-field [label]="('holdings.add.averageCost' | transloco) + ' ' + ('holdings.add.averageCostOptional' | transloco)">
    <input
      autocomplete="off"
      data-testid="holding-add-average-cost"
      inputmode="decimal"
      type="text"
      uiInput
      [value]="averageCostText()"
      (input)="averageCostInput.emit($event)"
    />
  </ui-field>
</div>

@if (valueAtProbe() !== null) {
  <p class="text-label text-(--muted-foreground)" data-testid="holding-add-value-at-probe">
    {{ 'holdings.add.valueAtProbe' | transloco: { value: '' } }}
    <ui-amount currency="EUR" [value]="valueAtProbe()" />
  </p>
}
