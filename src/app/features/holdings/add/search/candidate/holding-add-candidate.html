<button
  data-testid="holding-add-online-candidate"
  size="dense"
  type="button"
  ui-row
  [unavailable]="foreign()"
  (click)="picked.emit(candidate())"
>
  <span class="flex min-w-0 flex-1 flex-col">
    <span class="text-body truncate font-medium">{{ candidate().name }}</span>
    <span class="text-caption text-pretty text-(--subtle-foreground)">
      {{ identifiers() }}
      @if (foreign()) {
        @if (identifiers()) {
          &middot;
        }
        {{ 'holdings.add.quotedIn' | transloco: { currency: candidate().currency } }}
      } @else if (navDate(); as date) {
        &middot; {{ 'holdings.add.navOn' | transloco: { date: date | shortDate } }}
      }
    </span>
  </span>
  <span class="flex flex-none flex-col items-end">
    @if (foreign()) {
      <span class="text-label font-medium">{{ 'holdings.add.unavailable' | transloco }}</span>
      <span class="text-caption text-(--subtle-foreground)">{{ 'holdings.add.euroOnly' | transloco }}</span>
    } @else {
      <ui-amount class="text-label font-medium" currency="EUR" [value]="candidate().probePrice" />
      <span class="text-caption text-(--subtle-foreground)">{{
        'holdings.add.priceCaption.' + candidate().source | transloco
      }}</span>
    }
  </span>
</button>
