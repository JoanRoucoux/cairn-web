@let source = 'enums.priceSource.' + group().source | transloco;
<ui-result-group
  data-testid="holding-add-group"
  [errorMessage]="'holdings.add.sourceError' | transloco: { source }"
  [hint]="'holdings.add.nature.' + group().source | transloco"
  [label]="source"
  [retryLabel]="'holdings.add.retry' | transloco"
  [state]="state()"
  (retry)="retried.emit()"
>
  <span resultGroupMessage>{{
    (group().state === 'short' ? 'holdings.add.amundiNeedsIsin' : 'holdings.add.sourceEmpty') | transloco: { source }
  }}</span>
  @for (candidate of group().candidates; track candidate.sourceRef) {
    <app-holding-add-candidate [candidate]="candidate" (picked)="picked.emit($event)" />
  }
</ui-result-group>
