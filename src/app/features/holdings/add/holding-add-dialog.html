<ui-dialog
  data-testid="holding-add-dialog"
  sheet="full"
  [busy]="submitting()"
  [closeLabel]="'dialog.close' | transloco"
  [heading]="'holdings.add.title' | transloco"
  [open]="open()"
  (closed)="onClosed()"
  (dismissed)="dismiss()"
>
  <form class="flex flex-col gap-4" id="holding-add-form" novalidate (submit)="onSubmit($event)">
    @switch (mode()) {
      @case ('sirius') {
        <app-holding-add-sirius
          [isinText]="siriusIsinText()"
          (back)="openMode('search')"
          (isinInput)="onSiriusIsinInput($event)"
        />
      }
      @case ('manual') {
        <app-holding-add-manual
          [assetClass]="manualClass()"
          [name]="manualName()"
          [priceText]="manualPriceText()"
          (assetClassChange)="onManualClassChange($event)"
          (back)="openMode('search')"
          (nameInput)="onManualNameInput($event)"
          (priceInput)="onManualPriceInput($event)"
        />
      }
      @default {
        @if (picked(); as title) {
          <app-holding-add-picked [title]="title" (changed)="unpick()" />
        } @else {
          <app-holding-add-search
            [filter]="filter()"
            [groups]="groups()"
            [narrowed]="narrowed()"
            [noneFound]="noneFound()"
            [query]="query()"
            [showResults]="showResults()"
            [tracked]="tracked()"
            [trackedState]="trackedState()"
            (filterChange)="onFilterChange($event)"
            (manualOpened)="openMode('manual')"
            (pickedCandidate)="pickCandidate($event)"
            (pickedTracked)="pickTracked($event)"
            (queryInput)="onQueryInput($event)"
            (retried)="retry($event)"
            (retriedTracked)="retryTracked()"
            (siriusOpened)="openMode('sirius')"
          />
        }
      }
    }

    @if (titleReady()) {
      <app-holding-add-position
        [accountId]="accountId()"
        [accountOptions]="accountOptions()"
        [averageCostText]="averageCostText()"
        [manual]="mode() === 'manual'"
        [quantityText]="quantityText()"
        [value]="value()"
        (accountChange)="onAccountChange($event)"
        (averageCostInput)="onAverageCostInput($event)"
        (quantityInput)="onQuantityInput($event)"
      />
    }

    @if (error(); as error) {
      <ui-alert data-testid="holding-add-error">
        {{ (error === 'duplicate' ? 'holdings.add.duplicate' : 'holdings.add.error') | transloco }}
      </ui-alert>
    }
  </form>

  <button
    class="max-lg:hidden"
    data-testid="holding-add-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="submitting()"
    (click)="dismiss()"
  >
    {{ 'holdings.add.cancel' | transloco }}
  </button>
  <button
    data-testid="holding-add-submit"
    dialogActions
    form="holding-add-form"
    type="submit"
    ui-button
    [disabled]="!valid() || submitting()"
    [loading]="submitting()"
  >
    {{ submitKey() | transloco }}
  </button>
</ui-dialog>
