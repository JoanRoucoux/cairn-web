<ui-dialog
  data-testid="holding-add-dialog"
  layout="list"
  width="560px"
  [closeLabel]="'dialog.close' | transloco"
  [heading]="(replacing() ? 'holdings.replace.title' : 'holdings.add.title') | transloco"
  [open]="open()"
  (dismissed)="dismiss()"
>
  <form class="flex flex-col gap-4" id="holding-add-form" novalidate (submit)="onSubmit($event)">
    @if (!replacing()) {
      <ui-field [label]="'holdings.add.account' | transloco">
        <select
          data-testid="holding-add-account"
          size="lg"
          uiSelect
          [value]="accountId()"
          (change)="onAccountChange($event)"
        >
          @for (account of accountOptions(); track account.id) {
            <option [selected]="account.id === accountId()" [value]="account.id">{{ account.label }}</option>
          }
        </select>
      </ui-field>
    }

    <div class="flex flex-col gap-4">
      @if (!picked()) {
        <app-holding-add-search
          [busy]="submitting()"
          [candidates]="candidates()"
          [catalogResults]="catalogResults()"
          [onlineError]="onlineError()"
          [onlineSearched]="onlineSearched()"
          [query]="query()"
          [replacing]="replacing()"
          [searchingOnline]="searchingOnline()"
          (pickedCatalog)="pickCatalog($event)"
          (pickedManual)="pickManual()"
          (pickedOnline)="pickOnline($event)"
          (queryInput)="onQueryInput($event)"
          (retried)="retryOnline()"
        />
      } @else {
        <app-holding-add-picked
          [assetClass]="assetClass()"
          [assetClasses]="assetClasses"
          [averageCostText]="averageCostText()"
          [gainAtProbe]="gainAtProbe()"
          [isNew]="isNew()"
          [manual]="picked()?.kind === 'manual'"
          [name]="pickedName()"
          [quantityText]="quantityText()"
          [sourceLabel]="pickedSourceLabel()"
          [sub]="pickedSub()"
          [trialPrice]="trialPrice()"
          [valueAtProbe]="valueAtProbe()"
          (assetClassInput)="onAssetClassChange($event)"
          (averageCostInput)="onAverageCostInput($event)"
          (changed)="unpick()"
          (quantityInput)="onQuantityInput($event)"
        />
      }
    </div>

    @if (duplicate()) {
      <ui-alert data-testid="holding-add-duplicate">{{ 'holdings.replace.duplicate' | transloco }}</ui-alert>
    } @else if (error()) {
      <ui-alert data-testid="holding-add-error">
        {{ instrumentError() ? ('holdings.add.instrumentError' | transloco) : ('holdings.add.error' | transloco) }}
      </ui-alert>
    }
  </form>

  <button
    class="max-lg:hidden"
    data-testid="holding-add-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="submitting()"
    (click)="dismiss()"
  >
    {{ 'holdings.add.cancel' | transloco }}
  </button>
  @if (!replacing()) {
    <button
      data-testid="holding-add-submit"
      dialogActions
      form="holding-add-form"
      type="submit"
      ui-button
      [disabled]="!valid() || submitting()"
      [loading]="submitting()"
    >
      {{ (isNew() ? 'holdings.add.submitNew' : 'holdings.add.submit') | transloco }}
    </button>
  }
</ui-dialog>
