<button
  class="self-start"
  data-testid="holding-add-back"
  size="slim"
  type="button"
  ui-button
  variant="ghost"
  (click)="back.emit()"
>
  <svg aria-hidden="true" lucideChevronLeft [size]="18" [strokeWidth]="1.75" />
  {{ 'holdings.add.backToSearch' | transloco }}
</button>

<div class="flex flex-col gap-0.5">
  <h3 class="text-body m-0 font-semibold">{{ 'holdings.add.sirius.title' | transloco }}</h3>
  <p class="text-label text-pretty text-(--muted-foreground)">{{ 'holdings.add.sirius.intro' | transloco }}</p>
</div>

<ui-field
  [error]="invalid() ? ('holdings.add.sirius.invalid' | transloco) : undefined"
  [hint]="hintKey() ? (hintKey() | transloco: { count: length() }) : undefined"
  [label]="'holdings.add.sirius.isin' | transloco"
>
  <input
    autocapitalize="characters"
    autocomplete="off"
    data-testid="holding-add-sirius-isin"
    maxlength="14"
    size="lg"
    spellcheck="false"
    type="text"
    uiInput
    [value]="isinText()"
    (input)="isinInput.emit($event)"
  />
</ui-field>

<ui-alert data-testid="holding-add-sirius-note" variant="warning">{{
  'holdings.add.sirius.note' | transloco
}}</ui-alert>
