<ui-dialog
  data-testid="manual-quote-dialog"
  width="480px"
  [busy]="form().submitting()"
  [closeLabel]="'dialog.close' | transloco"
  [heading]="'holdings.manualQuote.title' | transloco: { name: instrumentName() }"
  [open]="open()"
  (closed)="onClosed()"
  (dismissed)="dismiss()"
>
  <ui-field [label]="'holdings.manualQuote.asOf' | transloco">
    <input data-testid="manual-quote-as-of" type="date" uiInput [formField]="form.asOf" />
  </ui-field>

  <ui-field unit="€" [label]="'holdings.manualQuote.price' | transloco">
    <input
      data-testid="manual-quote-price"
      inputmode="decimal"
      step="0.0001"
      type="number"
      uiInput
      [formField]="form.price"
    />
  </ui-field>

  @if (error()) {
    <ui-alert data-testid="manual-quote-error">
      {{ 'holdings.manualQuote.error' | transloco }}
    </ui-alert>
  }

  <button
    data-testid="manual-quote-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="form().submitting()"
    (click)="dismiss()"
  >
    {{ 'holdings.manualQuote.cancel' | transloco }}
  </button>
  <button
    data-testid="manual-quote-submit"
    dialogActions
    type="button"
    ui-button
    [disabled]="form().submitting()"
    [loading]="form().submitting()"
    (click)="confirm()"
  >
    {{ 'holdings.manualQuote.submit' | transloco }}
  </button>
</ui-dialog>
