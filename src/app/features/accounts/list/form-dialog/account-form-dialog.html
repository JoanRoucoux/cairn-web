<ui-dialog
  data-testid="account-form-dialog"
  layout="form"
  width="528px"
  [busy]="form().submitting()"
  [closeLabel]="'dialog.close' | transloco"
  [heading]="(account() ? 'accounts.form.editTitle' : 'accounts.form.createTitle') | transloco"
  [open]="open()"
  (closed)="onClosed()"
  (dismissed)="dismiss()"
>
  <ui-field
    [error]="nameConflict() ? ('accounts.form.nameConflict' | transloco) : undefined"
    [label]="'accounts.nameLabel' | transloco"
  >
    <input
      data-testid="account-form-name"
      size="lg"
      type="text"
      uiInput
      [formField]="form.name"
      [placeholder]="'accounts.form.namePlaceholder' | transloco"
      (input)="onNameInput()"
    />
  </ui-field>

  <ui-field
    labelHidden
    [error]="savingsConflict() ? ('accounts.form.savingsConflict' | transloco) : undefined"
    [label]="'accounts.type' | transloco"
  >
    <ui-choice-chips
      data-testid="account-form-type"
      [formField]="form.type"
      [label]="'accounts.type' | transloco"
      [options]="typeOptions()"
    />
  </ui-field>

  <ui-field [label]="'accounts.institution' | transloco" [optional]="'accounts.optional' | transloco">
    <input
      data-testid="account-form-institution"
      size="lg"
      type="text"
      uiInput
      [formField]="form.institution"
      [placeholder]="'accounts.form.institutionPlaceholder' | transloco"
    />
  </ui-field>

  @if (error()) {
    <ui-alert data-testid="account-form-error">
      {{ 'accounts.form.error' | transloco }}
    </ui-alert>
  }

  <button
    class="max-lg:hidden"
    data-testid="account-form-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="form().submitting()"
    (click)="dismiss()"
  >
    {{ 'accounts.form.cancel' | transloco }}
  </button>
  <button
    data-testid="account-form-submit"
    dialogActions
    type="button"
    ui-button
    [disabled]="form().submitting() || form().invalid()"
    [loading]="form().submitting()"
    (click)="confirm()"
  >
    {{ (account() ? 'accounts.form.submit' : 'accounts.form.create') | transloco }}
  </button>
</ui-dialog>
