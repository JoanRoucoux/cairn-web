<ui-dialog
  data-testid="account-delete-dialog"
  layout="confirm"
  width="488px"
  [heading]="'accounts.delete.title' | transloco"
  [open]="open()"
  (dismissed)="dismiss()"
>
  <p class="text-body text-(--muted-foreground)">{{ 'accounts.delete.description' | transloco }}</p>

  @if (refused()) {
    <ui-alert data-testid="account-delete-refused">
      {{ pluralKey('accounts.delete.refused', account().lineCount) | transloco: { count: account().lineCount } }}
    </ui-alert>
  } @else if (error()) {
    <ui-alert data-testid="account-delete-error">
      {{ 'accounts.delete.error' | transloco }}
    </ui-alert>
  }

  <button
    data-testid="account-delete-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="deleting()"
    (click)="dismiss()"
  >
    {{ 'accounts.delete.cancel' | transloco }}
  </button>
  <button
    data-testid="account-delete-confirm"
    dialogActions
    type="button"
    ui-button
    variant="destructive"
    [disabled]="deleting()"
    (click)="confirm()"
  >
    {{ 'accounts.delete.submit' | transloco }}
  </button>
</ui-dialog>
