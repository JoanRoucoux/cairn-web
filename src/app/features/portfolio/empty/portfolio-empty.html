<ui-card>
  <div class="flex flex-col items-start gap-3 py-2 text-left lg:items-center lg:py-8 lg:text-center">
    <h2 class="text-title font-semibold text-(--foreground)">{{ 'portfolio.empty.title' | transloco }}</h2>
    <p class="text-body max-w-[460px] text-(--muted-foreground)">{{ 'portfolio.empty.description' | transloco }}</p>

    <div class="mt-1 flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
      <a routerLink="/holdings" ui-button>{{ 'portfolio.empty.addHolding' | transloco }}</a>
      <a routerLink="/profile" ui-button variant="outline">{{ 'portfolio.empty.importCsv' | transloco }}</a>
    </div>
  </div>
</ui-card>
