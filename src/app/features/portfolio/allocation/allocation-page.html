@if (portfolio.hasValue()) {
  <p class="text-body mb-4 text-(--muted-foreground)">
    {{ 'portfolio.allocation.total' | transloco }} <ui-amount currency="EUR" [value]="totalEur()" />
  </p>
}

<div class="grid gap-4 lg:grid-cols-2">
  <div
    class="rounded-container flex flex-col gap-2 bg-(--card) p-(--inset-card) shadow-[inset_0_0_0_1px_var(--border)]"
  >
    <h2 class="text-title px-2 font-semibold">{{ 'portfolio.allocation.byAssetClass' | transloco }}</h2>
    <ui-async
      [errorMessage]="'portfolio.allocation.errorMessage' | transloco"
      [errorTitle]="'portfolio.allocation.byAssetClassErrorTitle' | transloco"
      [retryLabel]="'portfolio.retry' | transloco"
      [state]="assetClassState()"
      (retry)="retry()"
    >
      <span asyncLoading><ui-skeleton shape="ring" /></span>
      <span asyncEmpty class="text-label text-(--muted-foreground)">{{
        'portfolio.allocation.empty' | transloco
      }}</span>
      <ui-donut
        [label]="'portfolio.allocation.byAssetClass' | transloco"
        [othersLabel]="'portfolio.allocation.others' | transloco"
        [shareFormat]="formatShare"
        [slices]="assetClassSlices()"
        [valueFormat]="formatEur"
        (sliceSelect)="onAssetClassSelect($event)"
      />
    </ui-async>
  </div>

  <div
    class="rounded-container flex flex-col gap-2 bg-(--card) p-(--inset-card) shadow-[inset_0_0_0_1px_var(--border)]"
  >
    <h2 class="text-title px-2 font-semibold">{{ 'portfolio.allocation.byAccount' | transloco }}</h2>
    <ui-async
      [errorMessage]="'portfolio.allocation.errorMessage' | transloco"
      [errorTitle]="'portfolio.allocation.byAccountErrorTitle' | transloco"
      [retryLabel]="'portfolio.retry' | transloco"
      [state]="accountState()"
      (retry)="retry()"
    >
      <span asyncLoading><ui-skeleton shape="ring" /></span>
      <span asyncEmpty class="text-label text-(--muted-foreground)">{{
        'portfolio.allocation.empty' | transloco
      }}</span>
      <ui-donut
        [label]="'portfolio.allocation.byAccount' | transloco"
        [othersLabel]="'portfolio.allocation.others' | transloco"
        [shareFormat]="formatShare"
        [slices]="accountSlices()"
        [valueFormat]="formatEur"
        (sliceSelect)="onAccountSelect($event)"
      />
    </ui-async>
  </div>
</div>
