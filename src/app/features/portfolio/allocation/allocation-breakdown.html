<h2 class="mb-4 text-[11px] font-semibold tracking-[0.09em] text-(--muted-foreground) uppercase">
  {{ heading() }}
</h2>

<div class="flex flex-col gap-4">
  @for (row of scaledRows(); track row.label) {
    <div
      class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-4 gap-y-1.5 sm:grid-cols-[10rem_1fr_4.5rem_7.5rem]"
    >
      <span class="truncate text-[13px]">{{ row.label }}</span>
      <span class="order-last col-span-2 sm:order-none sm:col-span-1">
        <ui-meter [label]="row.label" [tone]="row.tone" [value]="row.scaled" [valueText]="row.valueText" />
      </span>
      <span class="text-right text-[12.5px] text-(--muted-foreground) tabular-nums">{{ row.share | ratio }}</span>
      <span class="text-right text-[13px] font-semibold tabular-nums">{{ row.valueEur | money }}</span>
    </div>
  }
</div>
