<div class="flex flex-col gap-3" role="list">
  @for (envelope of envelopes(); track envelope.accountType) {
    <ui-card padding="sm" role="listitem">
      <ui-stat size="tile" [label]="'enums.accountType.' + envelope.accountType | transloco">
        <span class="flex items-baseline justify-between gap-3" uiStatValue>
          <span>{{ envelope.valueEur | money }}</span>
          <ui-delta class="text-sm" [unknownLabel]="'portfolio.unknown' | transloco" [value]="envelope.changeEur">
            {{ envelope.changeEur | signedMoney }}
          </ui-delta>
        </span>

        <span uiStatCaption>
          {{ periodKey() | transloco }} · {{ envelope.share | ratio }} {{ 'portfolio.envelopes.share' | transloco }}
        </span>
      </ui-stat>
    </ui-card>
  }
</div>
