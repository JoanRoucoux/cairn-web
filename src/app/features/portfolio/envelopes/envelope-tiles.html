<div class="grid grid-cols-1 gap-3 sm:grid-cols-2" role="list">
  @for (envelope of envelopes(); track envelope.accountType) {
    <ui-card padding="sm" role="listitem">
      <ui-stat size="tile" [label]="'enums.accountType.' + envelope.accountType | transloco">
        <span uiStatValue>{{ envelope.valueEur | money }}</span>

        <ui-delta uiStatDelta [unknownLabel]="'portfolio.unknown' | transloco" [value]="envelope.changeEur">
          {{ envelope.changeEur | signedMoney }}
        </ui-delta>

        <span uiStatCaption>{{ periodKey() | transloco }}</span>

        <span uiStatCaption>{{ envelope.share | ratio }} {{ 'portfolio.envelopes.share' | transloco }}</span>
      </ui-stat>
    </ui-card>
  }
</div>
