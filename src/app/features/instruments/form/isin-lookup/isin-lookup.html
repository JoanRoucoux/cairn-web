<div class="flex flex-wrap items-start gap-2.5">
  <ui-field
    class="grow"
    [error]="blank() ? ('instruments.lookup.blank' | transloco) : undefined"
    [label]="'instruments.lookup.label' | transloco"
  >
    <input
      data-testid="isin-input"
      type="search"
      uiInput
      [placeholder]="'instruments.lookup.placeholder' | transloco"
      [value]="query()"
      (input)="onQueryInput($event)"
    />
  </ui-field>
  <div class="flex flex-col gap-1.5">
    <span aria-hidden="true" class="text-[13px] font-medium">&nbsp;</span>
    <button data-testid="isin-search" type="button" ui-button [disabled]="searching()" (click)="onSearch()">
      {{ 'instruments.lookup.search' | transloco }}
    </button>
  </div>
</div>

@if (searching()) {
  <p class="mt-3 text-[13px] text-(--muted-foreground)" role="status">
    {{ 'instruments.lookup.searching' | transloco }}
  </p>
}

@if (notFound()) {
  <p class="mt-3 text-[13px] text-(--stale)" role="status">{{ 'instruments.lookup.notFound' | transloco }}</p>
}

@if (candidates().length > 0) {
  <ul class="mt-3 flex flex-col gap-2" role="list">
    @for (candidate of candidates(); track candidate.sourceRef) {
      <li>
        <button
          class="flex min-h-11 w-full items-center justify-between gap-3 rounded-lg border border-(--border) bg-(--card) px-3.5 py-2.5 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--ring)"
          data-testid="isin-candidate"
          type="button"
          (click)="picked.emit(candidate)"
        >
          <span class="flex min-w-0 flex-col gap-0.5">
            <span class="truncate text-[13.5px] font-medium">{{ candidate.name }}</span>
            <span class="text-[11px] text-(--subtle-foreground) tabular-nums">
              {{ candidate.source }} &middot; {{ candidate.sourceRef }}
            </span>
          </span>
          <span class="shrink-0 text-[13px] font-semibold tabular-nums">{{ candidate.probePrice | money }}</span>
        </button>
      </li>
    }
  </ul>
}
