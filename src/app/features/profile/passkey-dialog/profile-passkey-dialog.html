<ui-dialog
  data-testid="profile-passkey-dialog"
  width="md"
  [closeLabel]="'dialog.close' | transloco"
  [description]="'profile.addPasskeyDescription' | transloco"
  [heading]="'profile.addPasskeyTitle' | transloco"
  [open]="open()"
  (closed)="onClosed()"
  (dismissed)="dismiss()"
>
  <!-- novalidate: the native required/maxlength validation would block submit() from ever running. -->
  <form id="profile-passkey-form" novalidate (submit)="onSubmit($event)">
    <ui-field [label]="'profile.addPasskeyLabel' | transloco">
      <input data-testid="passkey-label" type="text" uiInput [formField]="form.label" />
    </ui-field>

    @if (unsupported()) {
      <ui-alert class="mt-3" data-testid="passkey-unsupported">{{
        'profile.addPasskeyUnsupported' | transloco
      }}</ui-alert>
    }
    @if (failed()) {
      <ui-alert class="mt-3" data-testid="passkey-failed">{{ 'profile.addPasskeyFailed' | transloco }}</ui-alert>
    }
  </form>

  <button
    data-testid="passkey-cancel"
    dialogActions
    type="button"
    ui-button
    variant="outline"
    [disabled]="submitting()"
    (click)="dismiss()"
  >
    {{ 'profile.addPasskeyCancel' | transloco }}
  </button>
  <button
    data-testid="passkey-register"
    dialogActions
    form="profile-passkey-form"
    type="submit"
    ui-button
    [disabled]="submitting()"
  >
    {{ (submitting() ? 'profile.addPasskeySubmitting' : 'profile.addPasskeySubmit') | transloco }}
  </button>
</ui-dialog>
