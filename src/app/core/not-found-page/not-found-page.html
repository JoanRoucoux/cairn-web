<main
  class="flex min-h-dvh flex-col px-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))] lg:items-center lg:justify-center lg:p-0"
>
  <div class="flex flex-1 flex-col items-center justify-center gap-5 text-center lg:w-95 lg:flex-none lg:gap-8">
    <app-cairn-mark class="[&>svg]:size-22 lg:[&>svg]:size-18" [size]="88" />

    <div class="flex max-w-85.5 flex-col gap-2 text-balance lg:max-w-none">
      <h1 class="text-heading font-semibold tracking-(--tracking-display)">{{ 'notFound.title' | transloco }}</h1>
      <p class="text-body text-pretty text-(--muted-foreground)">{{ 'notFound.description' | transloco }}</p>
    </div>
  </div>

  <div class="flex flex-col gap-3 lg:mt-8 lg:items-center">
    <a class="w-full lg:h-11 lg:w-auto lg:pr-5 lg:pl-4" routerLink="/" size="xxl" ui-button>
      <svg lucideHouse [size]="20" [strokeWidth]="1.75" />
      {{ 'notFound.home' | transloco }}
    </a>

    <span class="text-label text-center text-(--subtle-foreground)">{{ 'notFound.error404' | transloco }}</span>
  </div>
</main>
