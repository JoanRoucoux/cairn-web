<div class="flex flex-col items-center gap-6 py-24 text-center">
  <app-cairn-mark [size]="64" />

  <div class="flex max-w-sm flex-col gap-2">
    <h1 class="text-heading font-semibold tracking-tight">{{ 'notFound.title' | transloco }}</h1>
    <p class="text-body text-(--muted-foreground)">{{ 'notFound.description' | transloco }}</p>
  </div>

  <a routerLink="/" size="lg" ui-button>
    <svg lucideHouse [size]="20" [strokeWidth]="1.75" />
    {{ 'notFound.home' | transloco }}
  </a>

  <span class="text-label text-(--subtle-foreground)">{{ 'notFound.error404' | transloco }}</span>
</div>
