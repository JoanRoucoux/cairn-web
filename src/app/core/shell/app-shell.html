<a
  class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-3 focus:rounded-md focus:bg-(--card) focus:px-4 focus:py-2 focus:outline-2 focus:outline-(--ring)"
  href="#main-content"
>
  {{ 'shell.skipToContent' | transloco }}
</a>

<div class="flex min-h-dvh">
  <!-- Desktop: sidebar. Hidden below lg, where the tab bar takes over. -->
  <aside class="hidden w-62 shrink-0 flex-col border-r border-(--border) bg-(--elevated) p-4 lg:flex">
    <div class="flex items-center gap-2 px-3 pb-6">
      <span class="text-[15px] font-bold tracking-[0.09em]">CAIRN</span>
    </div>

    <nav class="flex flex-col gap-0.5" [attr.aria-label]="'shell.primary' | transloco">
      @for (destination of destinations; track destination.path) {
        <a
          class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-sm font-medium text-(--muted-foreground) hover:text-(--foreground) focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--ring)"
          routerLinkActive="bg-(--soft) font-semibold text-(--foreground)"
          [routerLink]="destination.path"
          [routerLinkActiveOptions]="{ exact: destination.path === '/' }"
        >
          {{ destination.labelKey | transloco }}
        </a>
      }
    </nav>

    <a
      class="mt-auto flex min-h-11 items-center gap-3 rounded-xl border border-(--border) bg-(--card) px-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--ring)"
      data-testid="account-link-desktop"
      routerLink="/profile"
    >
      <ui-avatar size="sm" [initials]="owner().initials" [label]="'shell.account' | transloco" />
      <span class="text-[13px] font-semibold">{{ owner().displayName }}</span>
    </a>
  </aside>

  <div class="flex min-w-0 grow flex-col">
    <!-- Mobile: top bar carrying the account entry point, mirroring the sidebar footer. -->
    <header class="flex items-center justify-between px-4 pt-3 pb-2 lg:hidden">
      <a
        class="flex size-11 items-center justify-center rounded-full focus-visible:outline-2 focus-visible:outline-(--ring)"
        data-testid="account-link-mobile"
        routerLink="/profile"
      >
        <ui-avatar size="sm" [initials]="owner().initials" [label]="'shell.account' | transloco" />
      </a>
      <span class="text-sm font-bold tracking-[0.05em]">CAIRN</span>
      <span class="size-11"></span>
    </header>

    <app-offline-banner />

    <main class="grow" id="main-content">
      <div class="mx-auto w-full max-w-6xl px-4 py-4 lg:px-8 lg:py-6">
        <router-outlet />
      </div>
    </main>

    <nav
      class="sticky bottom-0 flex border-t border-(--hairline) bg-(--elevated) pt-2 pb-4 lg:hidden"
      [attr.aria-label]="'shell.primary' | transloco"
    >
      @for (destination of destinations; track destination.path) {
        <a
          class="flex min-h-11 flex-1 flex-col items-center justify-center gap-1 text-[10px] text-(--muted-foreground) focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--ring)"
          routerLinkActive="font-semibold text-(--primary)"
          [routerLink]="destination.path"
          [routerLinkActiveOptions]="{ exact: destination.path === '/' }"
        >
          {{ destination.labelKey | transloco }}
        </a>
      }
    </nav>
  </div>
</div>
