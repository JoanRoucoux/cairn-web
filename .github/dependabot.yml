version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 breaks typescript-eslint (via ts-api-utils); see AGENTS.md Gotchas.
      - dependency-name: 'typescript'
        versions: ['>=7']
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Node major follows .nvmrc and the CI's node-version, changed together by hand.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      images:
        patterns:
          - '*'
