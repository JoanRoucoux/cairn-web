version: 2
updates:
  # One pull request for the whole npm tree, not one per family: the halves are coupled
  # anyway (an Angular bump moves angular-eslint and the builder, a Playwright bump moves the
  # browser its runner launches), so reviewing them apart means merging them in an order nobody
  # chose. Dependabot cannot group two ecosystems together, so actions keep their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 breaks typescript-eslint (via ts-api-utils). Remove once
      # typescript-eslint supports TS 7 — see AGENTS.md Gotchas.
      - dependency-name: 'typescript'
        versions: ['>=7']
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
