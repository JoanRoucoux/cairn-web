# Builds the frontend image and deploys it, on a tag and only on a tag. workflow_dispatch
# redeploys an existing tag without rebuilding.
#
# This repository owns WEB_TAG in /srv/cairn/.env and the `web` service alone. The backend
# releases from the cairn repository, on its own tag, without either waiting for the other:
# the two halves share an origin and a compose file, not a version.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to redeploy, e.g. v0.1.0'
        required: true

permissions:
  contents: read
  packages: write

env:
  # Neither value is a secret: the host is what cairn.joanroucoux.fr resolves to, and a host key
  # is public by construction. Pinning the fingerprint here is what stops the deploy from
  # trusting whatever answers on that address.
  DEPLOY_HOST: 51.255.42.146
  DEPLOY_KNOWN_HOSTS: '51.255.42.146 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEbEn9NUsA5n7n1DSBWaozWpMVcs7JsBn6Y82kH3oGxN'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/joanroucoux/cairn-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # `skipped` is the workflow_dispatch path, where the image already exists.
    if: ${{ !cancelled() && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authorize this runner on the server
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r': the key was very likely pasted from Windows, and a stray carriage return
          # makes OpenSSH reject it with an error naming neither the cause nor the file.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Start the new frontend
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/deploy.sh "deploy@${DEPLOY_HOST}:/srv/cairn/deploy-web.sh"
          # The token goes down stdin; the tag and the actor are not secrets and may be arguments.
          printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh -i ~/.ssh/id_ed25519 "deploy@${DEPLOY_HOST}" \
                "bash /srv/cairn/deploy-web.sh '${RELEASE_TAG}' '${{ github.actor }}'"

      - name: Check the page is served
        run: |
          # The container's own healthcheck already gated the deploy through --wait; this only
          # confirms the path through Caddy from outside.
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://cairn.joanroucoux.fr/)
          echo "GET / -> $code"
          [ "$code" = "200" ] || exit 1

      - name: Check the translations are served uncacheable
        run: |
          cache=$(curl -sSI https://cairn.joanroucoux.fr/i18n/en.json | tr -d '\r' | grep -i '^cache-control:' || true)
          echo "GET /i18n/en.json -> ${cache:-no Cache-Control}"
          echo "$cache" | grep -qi 'no-cache' || exit 1
