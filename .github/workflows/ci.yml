name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # openapi/openapi.yaml is a copy: cairn-api owns the contract, this repository only
      # generates a client from it. Nothing but this step stops the two from drifting apart and
      # the client being generated against a stale spec. A backend contract change therefore
      # merges first; `pnpm run api:sync` pulls it here.
      - name: Check the API contract matches the backend
        run: |
          curl -fsSL -o "$RUNNER_TEMP/upstream-openapi.yaml" "$CONTRACT_URL"
          diff -u "$RUNNER_TEMP/upstream-openapi.yaml" openapi/openapi.yaml || {
            echo "::error file=openapi/openapi.yaml::Out of sync with cairn-api. Run: pnpm run api:sync"
            exit 1
          }
        env:
          CONTRACT_URL: https://raw.githubusercontent.com/JoanRoucoux/cairn/main/cairn-api/openapi/openapi.yaml

      # Also generates the OpenAPI clients and models (postinstall).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # No other job touches the production image, so the Dockerfile and its nginx
  # config would rot unnoticed: build it and check what it actually serves.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: docker build -t app:ci .

      - name: Check that nginx serves the app and falls back to index.html
        run: |
          docker run -d --name web -p 8080:80 app:ci
          timeout 60 sh -c 'until curl -sf http://localhost:8080/ > /dev/null; do sleep 2; done'
          curl -sf http://localhost:8080/users/1 | grep -q "<app-root>"
